{{- if .Values.grpcRoute.enabled }}
{{- $fullname := include "opentelemetry-gateway.fullname" . }}
{{- /*
otelarrow on 4317 has no profiles signal, so profiles use the otlp receiver on 4319.
Both profiles package names are listed, because the signal rename is in progress.
The ports have appProtocol kubernetes.io/h2c, so the gateway uses h2c to the backend.
A gRPC service that is not listed gets no route.
*/}}
{{- $grpc := dict
  "logs" (dict "port" 4317 "services" (list "opentelemetry.proto.collector.logs.v1.LogsService" "opentelemetry.proto.experimental.arrow.v1.ArrowLogsService"))
  "traces" (dict "port" 4317 "services" (list "opentelemetry.proto.collector.trace.v1.TraceService" "opentelemetry.proto.experimental.arrow.v1.ArrowTracesService"))
  "metrics" (dict "port" 4317 "services" (list "opentelemetry.proto.collector.metrics.v1.MetricsService" "opentelemetry.proto.experimental.arrow.v1.ArrowMetricsService"))
  "profiles" (dict "port" 4319 "services" (list "opentelemetry.proto.collector.profiles.v1development.ProfilesService" "opentelemetry.proto.collector.profiles.v1.ProfilesService"))
}}
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: {{ $fullname }}-grpc
  labels:
    {{- include "opentelemetry-gateway.labels" . | nindent 4 }}
spec:
  parentRefs:
    {{- toYaml .Values.grpcRoute.parentRefs | nindent 4 }}
  hostnames:
    {{- toYaml .Values.grpcRoute.hostnames | nindent 4 }}
  rules:
    {{- range $signal := splitList " " (include "opentelemetry-gateway.signals" .) }}
    {{- $backend := index $grpc $signal }}
    - matches:
        {{- range $backend.services }}
        - method:
            type: Exact
            service: {{ . }}
        {{- end }}
      backendRefs:
        - name: {{ $fullname }}-{{ $signal }}-collector
          port: {{ $backend.port }}
    {{- end }}
{{- end }}
