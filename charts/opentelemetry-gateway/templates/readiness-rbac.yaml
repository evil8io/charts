apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "opentelemetry-gateway.fullname" . }}-ready
  labels:
    {{- include "opentelemetry-gateway.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "opentelemetry-gateway.fullname" . }}-ready
  labels:
    {{- include "opentelemetry-gateway.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "opentelemetry-gateway.fullname" . }}-ready
  labels:
    {{- include "opentelemetry-gateway.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "opentelemetry-gateway.fullname" . }}-ready
subjects:
  - kind: ServiceAccount
    name: {{ include "opentelemetry-gateway.fullname" . }}-ready
    namespace: {{ .Release.Namespace }}
