{{- if not (has .Values.platform (list "generic" "aws")) }}
{{- fail (printf "platform must be generic or aws, not %q" .Values.platform) }}
{{- end }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "node-local-dns.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "node-local-dns.labels" . | nindent 4 }}
    kubernetes.io/cluster-service: "true"
    addonmanager.kubernetes.io/mode: Reconcile
spec:
  {{- with .Values.updateStrategy }}
  updateStrategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "node-local-dns.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "node-local-dns.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      serviceAccountName: {{ include "node-local-dns.fullname" . }}
      enableServiceLinks: true
      {{- with .Values.dnsConfig }}
      dnsPolicy: None
      dnsConfig:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/os
                    operator: In
                    values:
                      - linux
                  - key: kubernetes.io/arch
                    operator: In
                    values:
                      - amd64
                      - arm64
                  {{- if eq .Values.platform "aws" }}
                  - key: eks.amazonaws.com/compute-type
                    operator: NotIn
                    values:
                      - fargate
                  {{- end }}
      nodeSelector:
        kubernetes.io/os: linux
      {{- if .Values.nodeRoleLabel.enabled }}
      initContainers:
        - name: node-role-label
          image: {{ include "node-local-dns.kubectlImage" . }}
          command:
            - /bin/sh
            - -euxc
            - |
              role="$(kubectl get node "$K8S_NODE_NAME" -ojson | jq -r '.metadata.labels."{{ .Values.nodeRoleLabel.key }}"')"
              for attempt in 1 2 3 4 5; do
                if kubectl label --overwrite node "$K8S_NODE_NAME" "node-role.kubernetes.io/$role"=; then
                  exit 0
                fi
                sleep "$attempt"
              done
              exit 1
          env:
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: spec.nodeName
      {{- end }}
      containers:
        - name: node-cache
          image: {{ printf "%s:%s" .Values.image.repository (toString .Values.image.tag) | quote }}
          securityContext:
            readOnlyRootFilesystem: true
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          args:
            - -localip
            - {{ .Values.localIp | quote }}
            - -conf
            - /tmp/Corefile
            - -upstreamsvc
            - {{ .Values.upstreamService.name | quote }}
            {{- range .Values.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          ports:
            - containerPort: 53
              name: dns
              protocol: UDP
            - containerPort: 53
              name: dns-tcp
              protocol: TCP
            - containerPort: 9253
              name: metrics
              protocol: TCP
            - containerPort: 9353
              name: nld-metrics
              protocol: TCP
          livenessProbe:
            failureThreshold: 5
            httpGet:
              path: /health
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 60
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 5
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: config-volume
              mountPath: /etc/coredns
            - name: kube-dns-config
              mountPath: /etc/kube-dns
        {{- if .Values.taintRemover.enabled }}
        - name: node-taint-remover
          image: {{ include "node-local-dns.kubectlImage" . }}
          securityContext:
            readOnlyRootFilesystem: true
          {{- with .Values.taintRemover.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command:
            - /bin/sh
            - -euxc
            - |
              for i in `seq 1 120`; do
                timeout 1s getent hosts kubernetes.default.svc.cluster.local. && break
                sleep 1
              done
              for i in `seq 1 120`; do
                out=$(kubectl taint node "$K8S_NODE_NAME" {{ .Values.taintRemover.taint }}- 2>&1) && break
                echo "$out"
                case "$out" in
                  *"not found"*) break ;;
                esac
                sleep 5
              done
              exec sleep infinity
          env:
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: spec.nodeName
        {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: kube-dns-config
          configMap:
            name: kube-dns
            optional: true
        - name: config-volume
          configMap:
            name: {{ include "node-local-dns.fullname" . }}
            items:
              - key: Corefile
                path: Corefile.base
