{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "restart-controller.fullname" . }}
  labels:
    {{- include "restart-controller.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "restart-controller.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    - ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP
{{- end }}
