apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "restart-controller.stateName" . }}
  labels:
    {{- include "restart-controller.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "restart-controller.stateName" . }}
  labels:
    {{- include "restart-controller.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
    resourceNames:
      - {{ include "restart-controller.stateName" . }}
    verbs:
      - get
      - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "restart-controller.stateName" . }}
  labels:
    {{- include "restart-controller.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "restart-controller.stateName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "restart-controller.fullname" . }}
    namespace: {{ .Release.Namespace }}
