---
suite: service accounts

templates:
  - templates/api-filter-serviceaccount.yaml
  - templates/api-filter-deployment.yaml
  - templates/project-sync-serviceaccount.yaml
  - templates/project-sync-deployment.yaml
  - templates/rotate-token-serviceaccount.yaml
  - templates/rotate-token-cronjob.yaml

release:
  name: drover
  namespace: cattle-system

set:
  rancher.url: https://rancher.cattle-system.svc

tests:
  - it: creates one service account per component
    asserts:
      - template: templates/api-filter-serviceaccount.yaml
        equal:
          path: metadata.name
          value: drover-api-filter
      - template: templates/project-sync-serviceaccount.yaml
        equal:
          path: metadata.name
          value: drover-project-sync
      - template: templates/rotate-token-serviceaccount.yaml
        equal:
          path: metadata.name
          value: drover-rotate-token
      - template: templates/api-filter-deployment.yaml
        equal:
          path: spec.template.spec.serviceAccountName
          value: drover-api-filter
      - template: templates/project-sync-deployment.yaml
        equal:
          path: spec.template.spec.serviceAccountName
          value: drover-project-sync
      - template: templates/rotate-token-cronjob.yaml
        equal:
          path: spec.jobTemplate.spec.template.spec.serviceAccountName
          value: drover-rotate-token
  - it: keeps the automount off on the filter and the sync and on for the rotation
    asserts:
      - template: templates/api-filter-serviceaccount.yaml
        equal:
          path: automountServiceAccountToken
          value: false
      - template: templates/project-sync-serviceaccount.yaml
        equal:
          path: automountServiceAccountToken
          value: false
      - template: templates/rotate-token-serviceaccount.yaml
        notExists:
          path: automountServiceAccountToken
      - template: templates/rotate-token-cronjob.yaml
        equal:
          path: spec.jobTemplate.spec.template.spec.automountServiceAccountToken
          value: true
