---
suite: openbao admin serviceaccount

templates:
  - templates/openbao-admin-serviceaccount.yaml

release:
  name: drover
  namespace: cattle-system

set:
  rancher.url: https://rancher.cattle-system.svc

tests:
  - it: renders nothing by default
    asserts:
      - hasDocuments:
          count: 0
  - it: names the ServiceAccount after the openbao fullname when the gate is on
    set:
      projectSync.serviceAccounts.enabled: true
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: drover-openbao-admin
      - equal:
          path: metadata.namespace
          value: cattle-system
      - equal:
          path: automountServiceAccountToken
          value: false
  - it: follows the openbao fullname override
    set:
      projectSync.serviceAccounts.enabled: true
      openbao.fullnameOverride: vault-x
    asserts:
      - equal:
          path: metadata.name
          value: vault-x-admin
