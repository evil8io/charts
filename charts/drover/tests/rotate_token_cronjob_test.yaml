---
suite: rotate token cronjob

templates:
  - templates/rotate-token-cronjob.yaml

release:
  name: drover
  namespace: cattle-system

set:
  rancher.url: https://rancher.cattle-system.svc

tests:
  - it: runs every ten minutes without an overlap
    asserts:
      - isKind:
          of: CronJob
      - isAPIVersion:
          of: batch/v1
      - equal:
          path: metadata.name
          value: drover-rotate-token
      - equal:
          path: spec.schedule
          value: "*/10 * * * *"
      - equal:
          path: spec.concurrencyPolicy
          value: Forbid
      - equal:
          path: spec.startingDeadlineSeconds
          value: 300
      - equal:
          path: spec.jobTemplate.spec.template.spec.restartPolicy
          value: OnFailure
      - equal:
          path: spec.jobTemplate.spec.backoffLimit
          value: 6
  - it: runs one container per service user
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].name
          value: rotate-api-filter
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[1].name
          value: rotate-project-sync
  - it: builds the api-filter args in a fixed order
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].args
          value:
            - rotate-token
            - --rancher-url=https://rancher.cattle-system.svc
            - --credentials-dir=/var/run/secrets/drover/credentials
            - --token-secret=cattle-system/drover-token
            - --token-key=token
            - --password-secret=cattle-local-user-passwords/u-drover
            - --ttl=48h
            - --renew-before=24h
            - --keep=2
            - --log-level=info
  - it: builds the project-sync args in a fixed order
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[1].args
          value:
            - rotate-token
            - --rancher-url=https://rancher.cattle-system.svc
            - --credentials-dir=/var/run/secrets/drover/credentials
            - --token-secret=cattle-system/drover-project-sync-token
            - --token-key=token
            - --password-secret=cattle-local-user-passwords/u-drover-project-sync
            - --ttl=48h
            - --renew-before=24h
            - --keep=2
            - --log-level=info
  - it: follows the rotation values in the args
    set:
      logLevel: debug
      tokenRotation.ttl: 96h
      tokenRotation.renewBefore: 48h
      tokenRotation.keep: 3
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].args
          value:
            - rotate-token
            - --rancher-url=https://rancher.cattle-system.svc
            - --credentials-dir=/var/run/secrets/drover/credentials
            - --token-secret=cattle-system/drover-token
            - --token-key=token
            - --password-secret=cattle-local-user-passwords/u-drover
            - --ttl=96h
            - --renew-before=48h
            - --keep=3
            - --log-level=debug
  - it: adds the otlp args and the service name when the endpoint is set
    set:
      otlp.endpoint: otel-collector:4317
      otlp.serviceName: drover-rotate-token
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].args
          value:
            - rotate-token
            - --rancher-url=https://rancher.cattle-system.svc
            - --credentials-dir=/var/run/secrets/drover/credentials
            - --token-secret=cattle-system/drover-token
            - --token-key=token
            - --password-secret=cattle-local-user-passwords/u-drover
            - --ttl=48h
            - --renew-before=24h
            - --keep=2
            - --log-level=info
            - --otlp-endpoint=otel-collector:4317
            - --otlp-traces=true
            - --otlp-metrics=true
            - --service-name=drover-rotate-token
  - it: omits the otlp args when the endpoint is empty
    asserts:
      - notContains:
          path: spec.jobTemplate.spec.template.spec.containers[0].args
          content: --otlp-endpoint=otel-collector:4317
  - it: adds the pod UID env on both containers when the endpoint is set
    set:
      otlp.endpoint: otel-collector:4317
    asserts:
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: POD_UID
            valueFrom:
              fieldRef:
                fieldPath: metadata.uid
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: OTEL_RESOURCE_ATTRIBUTES
            value: k8s.pod.uid=$(POD_UID)
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[1].env
          content:
            name: POD_UID
            valueFrom:
              fieldRef:
                fieldPath: metadata.uid
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[1].env
          content:
            name: OTEL_RESOURCE_ATTRIBUTES
            value: k8s.pod.uid=$(POD_UID)
  - it: omits the pod UID env when the endpoint is empty
    asserts:
      - notContains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: POD_UID
      - notContains:
          path: spec.jobTemplate.spec.template.spec.containers[1].env
          content:
            name: POD_UID
  - it: omits the rancher-insecure-skip-verify arg by default
    asserts:
      - notContains:
          path: spec.jobTemplate.spec.template.spec.containers[0].args
          content: --rancher-insecure-skip-verify
  - it: renders the rancher-insecure-skip-verify arg when set
    set:
      rancher.insecureSkipVerify: true
    asserts:
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].args
          content: --rancher-insecure-skip-verify
  - it: mounts each container's own credentials Secret and no token Secret
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.volumes
          value:
            - name: credentials
              secret:
                secretName: drover-credentials
            - name: project-sync-credentials
              secret:
                secretName: drover-project-sync-credentials
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].volumeMounts
          value:
            - name: credentials
              mountPath: /var/run/secrets/drover/credentials
              readOnly: true
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[1].volumeMounts
          value:
            - name: project-sync-credentials
              mountPath: /var/run/secrets/drover/credentials
              readOnly: true
  - it: sets no env on either container when the endpoint is empty
    asserts:
      - notExists:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
      - notExists:
          path: spec.jobTemplate.spec.template.spec.containers[1].env
  - it: sets no GOMEMLIMIT env on either container
    set:
      otlp.endpoint: otel-collector:4317
    asserts:
      - notContains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: GOMEMLIMIT
          any: true
      - notContains:
          path: spec.jobTemplate.spec.template.spec.containers[1].env
          content:
            name: GOMEMLIMIT
          any: true
  - it: fails the render when renewBefore is not shorter than ttl
    set:
      tokenRotation.ttl: 24h
      tokenRotation.renewBefore: 1440m
    asserts:
      - failedTemplate:
          errorMessage: tokenRotation.renewBefore must be shorter than tokenRotation.ttl, because a longer window renews the token at every run
  - it: accepts a renewBefore one second shorter than ttl
    set:
      tokenRotation.ttl: 1h30m
      tokenRotation.renewBefore: 1h29m59s
    asserts:
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].args
          content: --renew-before=1h29m59s
  - it: rejects a keep below 2
    set:
      tokenRotation.keep: 1
    asserts:
      - failedTemplate: {}
  - it: rejects a ttl that is not a duration in hours, minutes, and seconds
    set:
      tokenRotation.ttl: 2d
    asserts:
      - failedTemplate: {}
