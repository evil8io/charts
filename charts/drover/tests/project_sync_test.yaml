---
suite: project sync deployment

templates:
  - templates/project-sync-deployment.yaml

release:
  name: drover
  namespace: cattle-system

set:
  rancher.url: https://rancher.cattle-system.svc

tests:
  - it: runs one pod and replaces it on an update
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: drover-project-sync
      - equal:
          path: spec.replicas
          value: 1
      - equal:
          path: spec.strategy
          value:
            type: Recreate
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
  - it: omits the labels and the annotations args when the lists are empty
    asserts:
      - equal:
          path: spec.template.spec.containers[0].args
          value:
            - project-sync
            - --rancher-url=https://rancher.cattle-system.svc
            - --token-file=/var/run/secrets/drover/token/token
            - --interval=60s
            - --log-level=info
  - it: builds the args in a fixed order with both lists
    set:
      projectSync.labelKeys:
        - evil8.io/cost-center
        - evil8.io/team
      projectSync.annotationKeys:
        - evil8.io/owner
    asserts:
      - equal:
          path: spec.template.spec.containers[0].args
          value:
            - project-sync
            - --rancher-url=https://rancher.cattle-system.svc
            - --token-file=/var/run/secrets/drover/token/token
            - --labels=evil8.io/cost-center,evil8.io/team
            - --annotations=evil8.io/owner
            - --interval=60s
            - --log-level=info
  - it: omits the name-label and the name-annotation args by default
    asserts:
      - equal:
          path: spec.template.spec.containers[0].args
          value:
            - project-sync
            - --rancher-url=https://rancher.cattle-system.svc
            - --token-file=/var/run/secrets/drover/token/token
            - --interval=60s
            - --log-level=info
  - it: renders the name-label and the name-annotation args when set
    set:
      projectSync.nameLabel: project.name
      projectSync.nameAnnotation: project.display_name
    asserts:
      - equal:
          path: spec.template.spec.containers[0].args
          value:
            - project-sync
            - --rancher-url=https://rancher.cattle-system.svc
            - --token-file=/var/run/secrets/drover/token/token
            - --name-label=project.name
            - --name-annotation=project.display_name
            - --interval=60s
            - --log-level=info
  - it: adds the otlp args when the endpoint is set
    set:
      otlp.endpoint: otel-collector:4317
    asserts:
      - equal:
          path: spec.template.spec.containers[0].args
          value:
            - project-sync
            - --rancher-url=https://rancher.cattle-system.svc
            - --token-file=/var/run/secrets/drover/token/token
            - --interval=60s
            - --log-level=info
            - --otlp-endpoint=otel-collector:4317
            - --otlp-traces=true
            - --otlp-metrics=true
            - --service-name=drover
  - it: omits the otlp args when the endpoint is empty
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --service-name=drover
  - it: omits the rancher-insecure-skip-verify arg by default
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --rancher-insecure-skip-verify
  - it: renders the rancher-insecure-skip-verify arg when set
    set:
      rancher.insecureSkipVerify: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --rancher-insecure-skip-verify
  - it: sets GOMEMLIMIT from the container memory limit
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env
          value:
            - name: GOMEMLIMIT
              valueFrom:
                resourceFieldRef:
                  resource: limits.memory
                  divisor: "1"
  - it: sets the deployment annotations without touching the pod template
    set:
      projectSync.annotations:
        evil8.io/vpa-min-memory: 64Mi
    asserts:
      - equal:
          path: metadata.annotations
          value:
            evil8.io/vpa-min-memory: 64Mi
      - notExists:
          path: spec.template.metadata.annotations
