---
suite: project sync deployment

templates:
  - templates/project-sync-deployment.yaml

release:
  name: drover
  namespace: cattle-system

set:
  rancher.url: https://rancher.cattle-system.svc

tests:
  - it: runs one pod and replaces it on an update
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: drover-project-sync
      - equal:
          path: spec.replicas
          value: 1
      - equal:
          path: spec.strategy
          value:
            type: Recreate
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
  - it: omits the labels and the annotations args when the lists are empty
    asserts:
      - equal:
          path: spec.template.spec.containers[0].args
          value:
            - project-sync
            - --rancher-url=https://rancher.cattle-system.svc
            - --token-file=/var/run/secrets/drover/token/token
            - --interval=60s
            - --patch-rate=50
            - --log-level=info
  - it: builds the args in a fixed order with both lists
    set:
      projectSync.labelKeys:
        - evil8.io/cost-center
        - evil8.io/team
      projectSync.annotationKeys:
        - evil8.io/owner
    asserts:
      - equal:
          path: spec.template.spec.containers[0].args
          value:
            - project-sync
            - --rancher-url=https://rancher.cattle-system.svc
            - --token-file=/var/run/secrets/drover/token/token
            - --labels=evil8.io/cost-center,evil8.io/team
            - --annotations=evil8.io/owner
            - --interval=60s
            - --patch-rate=50
            - --log-level=info
  - it: omits the name-label and the name-annotation args by default
    asserts:
      - equal:
          path: spec.template.spec.containers[0].args
          value:
            - project-sync
            - --rancher-url=https://rancher.cattle-system.svc
            - --token-file=/var/run/secrets/drover/token/token
            - --interval=60s
            - --patch-rate=50
            - --log-level=info
  - it: omits the service-accounts arg by default
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --service-accounts
  - it: renders the service-accounts arg and the openbao args when project-sync keeps ServiceAccounts
    set:
      projectSync.serviceAccounts.enabled: true
      httpRoute.hostnames:
        - rancher.example.com
    asserts:
      - equal:
          path: spec.template.spec.containers[0].args
          value:
            - project-sync
            - --rancher-url=https://rancher.cattle-system.svc
            - --token-file=/var/run/secrets/drover/token/token
            - --service-accounts
            - --openbao-address=http://drover-openbao-active.cattle-system:8200
            - --openbao-jwt-file=/var/run/secrets/openbao/token
            - --openbao-rancher-url=https://rancher.example.com
            - --openbao-token-ttl=24h
            - --openbao-credential-ttl=15m
            - --openbao-credential-max-ttl=2h
            - --interval=60s
            - --patch-rate=50
            - --log-level=info
  - it: takes the openbao rancher URL from global.broker.rancherUrl over the hostname
    set:
      projectSync.serviceAccounts.enabled: true
      global.broker.rancherUrl: https://rancher.internal.example.com
      httpRoute.hostnames:
        - rancher.example.com
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --openbao-rancher-url=https://rancher.internal.example.com
  - it: follows the clusterTokenTTL value
    set:
      projectSync.serviceAccounts.enabled: true
      httpRoute.hostnames:
        - rancher.example.com
      global.broker.clusterTokenTTL: 12h
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --openbao-token-ttl=12h
  - it: follows the global.broker.credentials TTL and max TTL values
    set:
      projectSync.serviceAccounts.enabled: true
      httpRoute.hostnames:
        - rancher.example.com
      global.broker.credentials.ttl: 20m
      global.broker.credentials.maxTTL: 3h
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --openbao-credential-ttl=20m
      - contains:
          path: spec.template.spec.containers[0].args
          content: --openbao-credential-max-ttl=3h
  - it: fails the render without a rancher URL for OpenBao
    set:
      projectSync.serviceAccounts.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: projectSync.serviceAccounts.enabled needs global.broker.rancherUrl or httpRoute.hostnames, because OpenBao reaches the clusters through the Rancher proxy
  - it: adds the openbao-token projected volume and its mount when project-sync keeps ServiceAccounts
    set:
      projectSync.serviceAccounts.enabled: true
      httpRoute.hostnames:
        - rancher.example.com
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: openbao-token
            projected:
              sources:
                - serviceAccountToken:
                    path: token
                    expirationSeconds: 3600
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: openbao-token
            mountPath: /var/run/secrets/openbao
            readOnly: true
  - it: omits the openbao-token volume and mount by default
    asserts:
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: openbao-token
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: openbao-token
  - it: mounts the project-sync token Secret, not the api-filter one
    asserts:
      - equal:
          path: spec.template.spec.volumes[0].secret.secretName
          value: drover-project-sync-token
  - it: renders the name-label and the name-annotation args when set
    set:
      projectSync.nameLabel: project.name
      projectSync.nameAnnotation: project.display_name
    asserts:
      - equal:
          path: spec.template.spec.containers[0].args
          value:
            - project-sync
            - --rancher-url=https://rancher.cattle-system.svc
            - --token-file=/var/run/secrets/drover/token/token
            - --name-label=project.name
            - --name-annotation=project.display_name
            - --interval=60s
            - --patch-rate=50
            - --log-level=info
  - it: adds the otlp args and the service name when the endpoint is set
    set:
      otlp.endpoint: otel-collector:4317
      otlp.serviceName: drover-project-sync
    asserts:
      - equal:
          path: spec.template.spec.containers[0].args
          value:
            - project-sync
            - --rancher-url=https://rancher.cattle-system.svc
            - --token-file=/var/run/secrets/drover/token/token
            - --interval=60s
            - --patch-rate=50
            - --log-level=info
            - --otlp-endpoint=otel-collector:4317
            - --otlp-traces=true
            - --otlp-metrics=true
            - --service-name=drover-project-sync
  - it: omits the otlp args when the endpoint is empty
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --otlp-endpoint=otel-collector:4317
  - it: adds the pod UID env when the endpoint is set
    set:
      otlp.endpoint: otel-collector:4317
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POD_UID
            valueFrom:
              fieldRef:
                fieldPath: metadata.uid
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_RESOURCE_ATTRIBUTES
            value: k8s.pod.uid=$(POD_UID)
  - it: omits the pod UID env when the endpoint is empty
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: POD_UID
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_RESOURCE_ATTRIBUTES
  - it: omits the rancher-insecure-skip-verify arg by default
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --rancher-insecure-skip-verify
  - it: renders the rancher-insecure-skip-verify arg when set
    set:
      rancher.insecureSkipVerify: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --rancher-insecure-skip-verify
  - it: sets no env when the endpoint is empty
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].env
  - it: sets no GOMEMLIMIT env
    set:
      otlp.endpoint: otel-collector:4317
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: GOMEMLIMIT
          any: true
  - it: sets the deployment annotations without touching the pod template
    set:
      projectSync.annotations:
        evil8.io/vpa-min-memory: 64Mi
    asserts:
      - equal:
          path: metadata.annotations
          value:
            evil8.io/vpa-min-memory: 64Mi
      - notExists:
          path: spec.template.metadata.annotations
