---
suite: trust annotation

templates:
  - templates/project-sync-trust-configmap.yaml
  - templates/trust-document.validatingpolicy.yaml

release:
  name: drover
  namespace: cattle-system

set:
  rancher.url: https://rancher.cattle-system.svc
  openbao.server.gateway.httpRoute.hosts:
    - rancher-tokens.example.com

tests:
  - it: does not render the trust ConfigMap or the trust-document policy without the project ServiceAccounts
    asserts:
      - template: templates/project-sync-trust-configmap.yaml
        hasDocuments:
          count: 0
      - template: templates/trust-document.validatingpolicy.yaml
        hasDocuments:
          count: 0
  - it: writes the default platform rules into the ConfigMap
    set:
      projectSync.serviceAccounts.enabled: true
    template: templates/project-sync-trust-configmap.yaml
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: drover-project-sync-trust
      - equal:
          path: data["trust.json"]
          value: |
            {
              "annotation": "drover.evil8.io/trust-policy",
              "audience": "https://rancher-tokens.example.com",
              "aws": {
                "allowedAccounts": [],
                "enabled": false
              },
              "jwtIssuers": {
                "github": {
                  "allowedClaims": {},
                  "requiredClaims": [
                    "repository_id"
                  ]
                },
                "gitlab": {
                  "allowedClaims": {},
                  "requiredClaims": [
                    "project_id"
                  ]
                }
              },
              "loginTokenTTL": "5m",
              "maxStatements": 20,
              "statusAnnotation": "managed.drover.evil8.io/trust-policy-status"
            }
  - it: takes the audience from global.broker.audience over the OpenBao host
    set:
      projectSync.serviceAccounts.enabled: true
      global.broker.audience: https://openbao.example.com
    template: templates/project-sync-trust-configmap.yaml
    asserts:
      - matchRegex:
          path: data["trust.json"]
          pattern: '"audience": "https://openbao\.example\.com"'
  - it: fails without an audience and without an OpenBao host
    set:
      projectSync.serviceAccounts.enabled: true
      openbao.server.gateway.httpRoute.hosts: []
    template: templates/project-sync-trust-configmap.yaml
    asserts:
      - failedTemplate:
          errorMessage: projectSync.serviceAccounts.enabled needs global.broker.audience or a host in openbao.server.gateway.httpRoute.hosts, because every JWT login role binds the audience
  - it: writes the allowed claims, the allowed accounts, and the trust keys into the ConfigMap
    set:
      projectSync.serviceAccounts.enabled: true
      global.broker.jwtIssuers.github.allowedClaims.ref:
        - refs/heads/main
      global.broker.aws.enabled: true
      global.broker.aws.allowedAccounts:
        - "123456789012"
      global.broker.loginTokenTTL: 10m
      global.broker.trust.annotation: evil8.io/trust
      global.broker.trust.statusAnnotation: managed.drover.evil8.io/trust-status
      global.broker.trust.maxStatements: 3
    template: templates/project-sync-trust-configmap.yaml
    asserts:
      - matchRegex:
          path: data["trust.json"]
          pattern: '"github": \{\n\s+"allowedClaims": \{\n\s+"ref": \[\n\s+"refs/heads/main"\n\s+\]'
      - matchRegex:
          path: data["trust.json"]
          pattern: '"aws": \{\n\s+"allowedAccounts": \[\n\s+"123456789012"\n\s+\],\n\s+"enabled": true'
      - matchRegex:
          path: data["trust.json"]
          pattern: '"annotation": "evil8\.io/trust"'
      - matchRegex:
          path: data["trust.json"]
          pattern: '"statusAnnotation": "managed\.drover\.evil8\.io/trust-status"'
      - matchRegex:
          path: data["trust.json"]
          pattern: '"maxStatements": 3,'
      - matchRegex:
          path: data["trust.json"]
          pattern: '"loginTokenTTL": "10m"'
  - it: fails when the trust annotation starts with the managed prefix
    set:
      projectSync.serviceAccounts.enabled: true
      global.broker.trust.annotation: managed.drover.evil8.io/trust
    template: templates/project-sync-trust-configmap.yaml
    asserts:
      - failedTemplate:
          errorMessage: global.broker.trust.annotation must not be under managed.drover.evil8.io, because project-sync does not start when the trust key is under that domain
  - it: fails when the trust annotation is in a subdomain of the managed domain
    set:
      projectSync.serviceAccounts.enabled: true
      global.broker.trust.annotation: x.managed.drover.evil8.io/trust
    template: templates/project-sync-trust-configmap.yaml
    asserts:
      - failedTemplate:
          errorMessage: global.broker.trust.annotation must not be under managed.drover.evil8.io, because project-sync does not start when the trust key is under that domain
  - it: fails when the status annotation does not start with the managed prefix
    set:
      projectSync.serviceAccounts.enabled: true
      global.broker.trust.statusAnnotation: drover.evil8.io/trust-status
    template: templates/project-sync-trust-configmap.yaml
    asserts:
      - failedTemplate:
          errorMessage: global.broker.trust.statusAnnotation must start with managed.drover.evil8.io/, because with the drover-policies chart the API server protects only the keys under that prefix
  - it: fails when project-sync copies the trust annotation to the namespaces
    set:
      projectSync.serviceAccounts.enabled: true
      projectSync.annotationKeys:
        - drover.evil8.io/trust-policy
    template: templates/project-sync-trust-configmap.yaml
    asserts:
      - failedTemplate:
          errorMessage: global.broker.trust.annotation and global.broker.trust.statusAnnotation must not be in projectSync.annotationKeys or equal projectSync.nameAnnotation, because project-sync does not
            start when it copies a trust key to the namespaces
  - it: fails when the status annotation is the display name annotation
    set:
      projectSync.serviceAccounts.enabled: true
      projectSync.nameAnnotation: managed.drover.evil8.io/trust-policy-status
    template: templates/project-sync-trust-configmap.yaml
    asserts:
      - failedTemplate:
          errorMessage: global.broker.trust.annotation and global.broker.trust.statusAnnotation must not be in projectSync.annotationKeys or equal projectSync.nameAnnotation, because project-sync does not
            start when it copies a trust key to the namespaces
  - it: rejects the claim aud in allowedClaims
    set:
      projectSync.serviceAccounts.enabled: true
      global.broker.jwtIssuers.github.allowedClaims.aud:
        - https://example.com
    template: templates/project-sync-trust-configmap.yaml
    asserts:
      - failedTemplate:
          errorPattern: invalid propertyName 'aud'
  - it: rejects an empty claim in allowedClaims
    set:
      projectSync.serviceAccounts.enabled: true
      global.broker.jwtIssuers.github.allowedClaims:
        "":
          - refs/heads/main
    template: templates/project-sync-trust-configmap.yaml
    asserts:
      - failedTemplate:
          errorPattern: "invalid propertyName ''"
  - it: rejects an issuer name longer than 63 characters
    set:
      projectSync.serviceAccounts.enabled: true
      global.broker.jwtIssuers:
        a123456789b123456789c123456789d123456789e123456789f123456789g123:
          discoveryUrl: https://issuer.example.com
          requiredClaims:
            - sub
    template: templates/project-sync-trust-configmap.yaml
    asserts:
      - failedTemplate:
          errorPattern: 'maxLength: got 64, want 63'
  - it: fails a login token TTL below 1m
    set:
      projectSync.serviceAccounts.enabled: true
      global.broker.loginTokenTTL: 30s
    template: templates/project-sync-trust-configmap.yaml
    asserts:
      - failedTemplate:
          errorMessage: global.broker.loginTokenTTL must be 1m to 24h, because project-sync does not start with another value
  - it: fails a login token TTL above 24h
    set:
      projectSync.serviceAccounts.enabled: true
      global.broker.loginTokenTTL: 24h1s
    template: templates/project-sync-trust-configmap.yaml
    asserts:
      - failedTemplate:
          errorMessage: global.broker.loginTokenTTL must be 1m to 24h, because project-sync does not start with another value
  - it: renders the default issuers, the statement cap, and MethodDisabled into the trust document policy
    set:
      projectSync.serviceAccounts.enabled: true
      projectPolicy.failurePolicy: Ignore
    template: templates/trust-document.validatingpolicy.yaml
    asserts:
      - isKind:
          of: ValidatingPolicy
      - equal:
          path: metadata.name
          value: drover-trust-document
      - equal:
          path: spec.failurePolicy
          value: Fail
      - equal:
          path: spec.evaluation.background.enabled
          value: false
      - matchRegex:
          path: spec.matchConditions[0].expression
          pattern: 'object\.metadata\.annotations\["drover\.evil8\.io/trust-policy"\] != ""'
      - equal:
          path: spec.variables[3].name
          value: issuers
      - equal:
          path: spec.variables[3].expression
          value: '{"github": dyn({"allowedClaims": dyn({}), "requiredClaims": dyn(["repository_id"])}), "gitlab": dyn({"allowedClaims": dyn({}), "requiredClaims": dyn(["project_id"])})}'
      - matchRegex:
          path: spec.variables[4].expression
          pattern: '"InvalidARN" :\n\s+"MethodDisabled"\n'
      - notMatchRegex:
          path: spec.variables[4].expression
          pattern: AccountNotAllowed
      - equal:
          path: spec.validations[2].expression
          value: variables.statements.size() <= 20
  - it: renders an added issuer, the allowed claims, and the allowed accounts into the trust document policy
    set:
      projectSync.serviceAccounts.enabled: true
      global.broker.jwtIssuers.cluster.discoveryUrl: https://oidc.eks.eu-west-1.amazonaws.com/id/ABC
      global.broker.jwtIssuers.cluster.requiredClaims:
        - sub
      global.broker.jwtIssuers.github.allowedClaims.ref:
        - refs/heads/main
      global.broker.aws.enabled: true
      global.broker.aws.allowedAccounts:
        - "123456789012"
      global.broker.trust.annotation: evil8.io/trust
      global.broker.trust.maxStatements: 3
    template: templates/trust-document.validatingpolicy.yaml
    asserts:
      - equal:
          path: spec.variables[3].expression
          value: '{"cluster": dyn({"allowedClaims": dyn({}), "requiredClaims": dyn(["sub"])}), "github": dyn({"allowedClaims": dyn({"ref": dyn(["refs/heads/main"])}), "requiredClaims": dyn(["repository_id"])}),
            "gitlab": dyn({"allowedClaims": dyn({}), "requiredClaims": dyn(["project_id"])})}'
      - matchRegex:
          path: spec.variables[4].expression
          pattern: '!\["123456789012"\]\.exists\(a, s\.aws\.arn\.startsWith\("arn:aws:iam::" \+ a \+ ":"\)\) \? "AccountNotAllowed" :\n\s+""\n'
      - notMatchRegex:
          path: spec.variables[4].expression
          pattern: MethodDisabled
      - matchRegex:
          path: spec.matchConditions[0].expression
          pattern: 'object\.metadata\.annotations\["evil8\.io/trust"\] != ""'
      - equal:
          path: spec.validations[2].expression
          value: variables.statements.size() <= 3
