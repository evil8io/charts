---
image:
  repository: ghcr.io/evil8io/drover
  # An empty tag selects the chart appVersion.
  tag: ""

logLevel: info

# An empty endpoint turns telemetry off.
otlp:
  endpoint: ""
  # The service.name of the drover telemetry. Empty sends none, so the collector derives it from the pod.
  serviceName: ""

rancher:
  # The Rancher Service in the cluster, for example https://rancher.cattle-system.
  url: ""
  # Skips the certificate verification of the url. For a Service inside the cluster whose certificate the deployment does not copy.
  insecureSkipVerify: false
  # The namespace of the Rancher Deployment. The project policy skips the writes of the ServiceAccounts in it.
  namespace: cattle-system

serviceUser:
  # The external-secrets Password generator writes the password into the credentials Secret.
  password:
    refreshInterval: 2160h
    length: 32
  # The hook Jobs that write and delete the Rancher RBAC of the service user.
  hook:
    image: docker.io/dtzar/helm-kubectl:4.3.0
    # The kubectl discovery of a Rancher cluster needs more than 64Mi.
    resources:
      requests:
        cpu: 10m
        memory: 256Mi
      limits:
        memory: 256Mi

apiFilter:
  replicaCount: 3
  cacheTTL: 15s
  # Hard bound on the cached allowed sets. Zero selects the default of the service.
  maxCacheEntries: 0
  # Fetches per second that the rate limit allows, for a fetch of an allowed set. Zero selects the default of the service.
  fetchRate: 0
  # Fetches per second that the rate limit of one caller allows, for a fetch of an allowed set. Zero selects the default of the service.
  fetchRatePerCaller: 0
  # Open watch streams above which a new watch answers 503. Zero selects the default of the service.
  maxWatches: 0
  # Open watch streams of one caller above which a new watch of that caller answers 503. Zero selects the default of the service.
  maxWatchesPerCaller: 0
  # Answers a cluster-wide list of a namespaced kind with one request per allowed namespace.
  fanout:
    enabled: false
    # Allowed namespaces above which such a list answers 403. Zero selects the default of the service.
    maxNamespaces: 0
    # Allowed namespaces above which a merged watch answers 403. Zero selects the default of the service.
    # A watch keeps one upstream connection open per namespace, so its bound is lower than the list bound.
    maxWatchNamespaces: 0
    # Namespaced requests of one fan-out that run at a time. Zero selects the default of the service.
    concurrency: 0
    # Namespaced requests of all fan-outs that run at a time. Zero selects the default of the service.
    maxInflight: 0
    # Part of maxInflight that the requests of one caller hold at a time. Zero selects the default of the service.
    maxInflightPerCaller: 0
  annotations: {}
  resources:
    requests:
      cpu: 10m
      memory: 256Mi
    limits:
      memory: 256Mi
  podDisruptionBudget:
    maxUnavailable: 1

tokenRotation:
  schedule: "*/10 * * * *"
  # A CronJob that misses 100 start times stops for good. The deadline bounds the count.
  startingDeadlineSeconds: 300
  ttl: 48h
  # A run renews the token when it expires inside this window. It must be shorter than ttl.
  renewBefore: 24h
  # The tokens to keep, the new token included. At least 2, so that the token in use stays valid after a renewal.
  keep: 2
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 64Mi

projectSync:
  interval: 60s
  # Requests per second to Rancher that the watches of one cluster send, together. A project event costs up to 9 requests.
  patchRate: 50
  # Label keys that the sync copies from a project to the namespaces of the project.
  labelKeys: []
  # Annotation keys that the sync copies.
  annotationKeys: []
  # Label key on a namespace that gets the display name of the project. Empty turns it off.
  nameLabel: ""
  # Annotation key that gets the display name. Empty turns it off.
  nameAnnotation: ""
  # Keeps three ServiceAccounts per Rancher project, one per project role, in a hidden project.
  serviceAccounts:
    enabled: false
  annotations: {}
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 64Mi

# A ValidatingPolicy on the Rancher projects. It renders when a key is listed.
projectPolicy:
  # Label keys that every project must have. Each key must be in projectSync.labelKeys.
  requiredLabels: []
  # Annotation keys that every project must have. Each key must be in projectSync.annotationKeys.
  requiredAnnotations: []
  # Fail denies a project write when Kyverno does not answer. Ignore lets it through.
  failurePolicy: Fail

httpRoute:
  # For example [{name: rancher, namespace: gateway}].
  parentRefs: []
  # For example [rancher.example.com].
  hostnames: []
  # A watch stream stays open for minutes. The gateway default request timeout is 15s.
  timeouts:
    request: 0s
  # The Rancher Service. The fan-out route sends the namespaced reads to it, so exec, attach,
  # portforward and a log stream stay off the filter. Required when the fan-out is on. A Service
  # in another namespace needs a ReferenceGrant in that namespace.
  rancherBackendRef:
    name: ""
    namespace: ""
    port: 80

# A Kyverno GeneratingPolicy that writes an enabled ClusterProxyConfig into the namespace of every
# cluster except local. The Rancher proxy then accepts a ServiceAccount token of a downstream cluster.
clusterProxyConfig:
  enabled: true

# The CiliumNetworkPolicies of the drover pods.
ciliumNetworkPolicy:
  enabled: true
  # The namespaces of the Gateway data plane, which reach the API filter and OpenBao.
  gatewayNamespaces: []

# The OpenBao configuration for the CI credentials. It installs with projectSync.serviceAccounts.enabled.
broker:
  # JWT issuers of CI jobs. Each issuer gets the auth mount auth/jwt/<name>.
  jwtIssuers:
    github:
      discoveryUrl: https://token.actions.githubusercontent.com
    gitlab:
      discoveryUrl: https://gitlab.com
  # The lifetime of a credential of a project ServiceAccount, and the longest lifetime that a request can ask for.
  credentials:
    ttl: 15m
    maxTTL: 2h
  # The Rancher URL through which OpenBao reaches the clusters. OpenBao verifies its certificate.
  # Empty selects https://<first httpRoute hostname>.
  rancherUrl: ""
  # The lifetime that project-sync requests for the token of the OpenBao ServiceAccount of a
  # cluster. The API server can shorten it, and project-sync writes a new token at half of it.
  clusterTokenTTL: 24h

# OpenBao for the CI credentials of the project ServiceAccounts. It installs with
# projectSync.serviceAccounts.enabled. The keys are those of https://github.com/openbao/openbao-helm.
openbao:
  injector:
    enabled: false
  server:
    updateStrategyType: RollingUpdate
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 128Mi
    dataStorage:
      size: 1Gi
    # The first entry is the Secret with the static seal key. A pre-install hook creates it once.
    extraVolumes:
      - type: secret
        name: openbao-seal
    # Only pod 0 initializes the cluster, and only while no other pod is initialized and no other
    # pod has a data volume. A follower that initializes itself forms a separate cluster:
    # https://github.com/openbao/openbao/issues/2274.
    extraInitContainers:
      - name: self-init
        image: '{{ .Values.server.image.registry }}/{{ .Values.server.image.repository }}:{{ .Values.server.image.tag | default (trimPrefix "v" .Chart.AppVersion) }}'
        command:
          - /bin/sh
          - -ec
          - |
            : > /openbao/self-init/self-init.hcl
            [ "${POD_NAME##*-}" = 0 ] || exit 0
            sa=/var/run/secrets/kubernetes.io/serviceaccount
            i=1
            while [ "$i" -lt {{ .Values.server.ha.replicas }} ]; do
              if bao operator init -status -address="http://{{ template "openbao.fullname" . }}-$i.{{ template "openbao.fullname" . }}-internal:8200" >/dev/null 2>&1; then
                exit 0
              fi
              if answer=$(SSL_CERT_FILE="$sa/ca.crt" wget -q -O /dev/null --header "Authorization: Bearer $(cat "$sa/token")" "https://$KUBERNETES_SERVICE_HOST:$KUBERNETES_SERVICE_PORT/api/v1/namespaces/{{ .Release.Namespace }}/persistentvolumeclaims/data-{{ template "openbao.fullname" . }}-$i" 2>&1); then
                exit 0
              fi
              case "$answer" in
                *" 404 "*) ;;
                *) echo "$answer" >&2; exit 1 ;;
              esac
              i=$((i + 1))
            done
            cat > /openbao/self-init/self-init.hcl <<'HCL'
            initialize "auth" {
              request "enable-kubernetes-auth" {
                operation = "update"
                path      = "sys/auth/kubernetes"
                data = {
                  type = "kubernetes"
                }
              }
              request "configure-kubernetes-auth" {
                operation = "update"
                path      = "auth/kubernetes/config"
                data = {
                  kubernetes_host = "https://kubernetes.default.svc"
                }
              }
            }
            initialize "admin" {
              request "admin-policy" {
                operation = "update"
                path      = "sys/policies/acl/admin"
                data = {
                  policy = <<-EOT
                    path "*" {
                      capabilities = ["create", "read", "update", "patch", "delete", "list", "sudo"]
                    }
                  EOT
                }
              }
              request "admin-role" {
                operation = "update"
                path      = "auth/kubernetes/role/admin"
                data = {
                  bound_service_account_names      = ["{{ template "openbao.fullname" . }}-admin"]
                  bound_service_account_namespaces = ["{{ .Release.Namespace }}"]
                  token_policies                   = ["admin"]
                  token_ttl                        = "1h"
                  token_max_ttl                    = "1h"
                }
              }
            }
            HCL
        env:
          - name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          - name: BAO_CLIENT_TIMEOUT
            value: 5s
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 64Mi
        volumeMounts:
          - name: self-init
            mountPath: /openbao/self-init
    extraArgs: -config=/openbao/self-init/self-init.hcl
    volumes:
      - name: self-init
        emptyDir: {}
    volumeMounts:
      - name: self-init
        mountPath: /openbao/self-init
        readOnly: true
    extraPorts:
      - name: metrics
        containerPort: 8210
    ha:
      enabled: true
      replicas: 3
      disruptionBudget:
        maxUnavailable: 1
      raft:
        enabled: true
        setNodeId: true
        # The API refuses an audit device, so the audit stanza declares it.
        config: |
          ui = true
          listener "tcp" {
            address         = "[::]:8200"
            cluster_address = "[::]:8201"
            tls_disable     = true
          }

          # Every TCP listener opens a cluster port, so this one binds to loopback.
          listener "tcp" {
            address         = "[::]:8210"
            cluster_address = "127.0.0.1:8211"
            tls_disable     = true
            telemetry {
              unauthenticated_metrics_access = true
            }
          }
          telemetry {
            prometheus_retention_time = "24h"
            disable_hostname          = true
          }
          storage "raft" {
            path = "/openbao/data"
            retry_join {
              leader_api_addr = "http://{{ template "openbao.fullname" . }}-active:8200"
            }
          }
          seal "static" {
            current_key_id = "1"
            current_key    = "file:///openbao/userconfig/{{ (first .Values.server.extraVolumes).name }}/key"
          }
          audit "file" "stdout" {
            options {
              file_path = "stdout"
            }
          }
          service_registration "kubernetes" {}
    gateway:
      httpRoute:
        enabled: false
        parentRefs: []
        hosts: []
