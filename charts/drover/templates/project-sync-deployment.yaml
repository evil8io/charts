{{- $component := dict "root" . "component" "project-sync" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "drover.projectSync.fullname" . }}
  {{- with .Values.projectSync.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    {{- include "drover.componentLabels" $component | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "drover.componentSelectorLabels" $component | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "drover.componentLabels" $component | nindent 8 }}
    spec:
      serviceAccountName: {{ include "drover.projectSync.fullname" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- include "drover.podSecurityContext" . | nindent 8 }}
      containers:
        - name: project-sync
          image: {{ include "drover.image" . | quote }}
          imagePullPolicy: IfNotPresent
          args:
            - project-sync
            - "--rancher-url={{ .Values.rancher.url }}"
            - "--token-file={{ include "drover.tokenFile" . }}"
            {{- with .Values.projectSync.labelKeys }}
            - "--labels={{ join "," . }}"
            {{- end }}
            {{- with .Values.projectSync.annotationKeys }}
            - "--annotations={{ join "," . }}"
            {{- end }}
            {{- with .Values.projectSync.nameLabel }}
            - "--name-label={{ . }}"
            {{- end }}
            {{- with .Values.projectSync.nameAnnotation }}
            - "--name-annotation={{ . }}"
            {{- end }}
            {{- if .Values.projectSync.serviceAccounts.enabled }}
            - "--service-accounts"
            - "--openbao-address={{ include "drover.openbao.address" . }}"
            - "--openbao-jwt-file=/var/run/secrets/openbao/token"
            - "--openbao-rancher-url={{ include "drover.broker.rancherUrl" . }}"
            - "--openbao-token-ttl={{ .Values.broker.clusterTokenTTL }}"
            - "--openbao-credential-ttl={{ .Values.broker.credentials.ttl }}"
            - "--openbao-credential-max-ttl={{ .Values.broker.credentials.maxTTL }}"
            {{- end }}
            - "--interval={{ .Values.projectSync.interval }}"
            - "--patch-rate={{ .Values.projectSync.patchRate }}"
            - "--log-level={{ .Values.logLevel }}"
            {{- if .Values.rancher.insecureSkipVerify }}
            - "--rancher-insecure-skip-verify"
            {{- end }}
            {{- if .Values.otlp.endpoint }}
            - "--otlp-endpoint={{ .Values.otlp.endpoint }}"
            - "--otlp-traces=true"
            - "--otlp-metrics=true"
            - "--service-name={{ .Values.otlp.serviceName }}"
            {{- end }}
          {{- if .Values.otlp.endpoint }}
          env:
            {{- include "drover.telemetryEnv" . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          securityContext:
            {{- include "drover.securityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.projectSync.resources | nindent 12 }}
          volumeMounts:
            - name: token
              mountPath: /var/run/secrets/drover/token
              readOnly: true
            {{- if .Values.projectSync.serviceAccounts.enabled }}
            - name: openbao-token
              mountPath: /var/run/secrets/openbao
              readOnly: true
            {{- end }}
      volumes:
        - name: token
          secret:
            secretName: {{ include "drover.projectSync.tokenSecretName" . }}
        {{- if .Values.projectSync.serviceAccounts.enabled }}
        - name: openbao-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
        {{- end }}
