{{- if not .Values.httpRoute.parentRefs }}
{{- fail "httpRoute.parentRefs is required" }}
{{- end }}
{{- if and .Values.apiFilter.fanout.enabled (not .Values.httpRoute.rancherBackendRef.name) }}
{{- fail "apiFilter.fanout.enabled needs httpRoute.rancherBackendRef.name, because the wide route must send the namespaced reads to Rancher" }}
{{- end }}
apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: {{ include "drover.fullname" . }}-routes
  labels:
    {{- include "drover.labels" . | nindent 4 }}
  annotations:
    policies.kyverno.io/title: Generate Drover Routes
    policies.kyverno.io/category: Multi-Tenancy
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: HTTPRoute
    policies.kyverno.io/description: >-
      Generates an HTTPRoute for every Rancher cluster object. The route sends the
      read paths of that cluster that the API filter answers to the filter, and it
      leaves every other path to Rancher.
spec:
  evaluation:
    generateExisting:
      enabled: true
    synchronize:
      enabled: false
    orphanDownstreamOnPolicyDelete:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups:
          - management.cattle.io
        apiVersions:
          - v3
        operations:
          - CREATE
        resources:
          - clusters
  variables:
    - name: prefix
      expression: '"/k8s/clusters/" + object.metadata.name'
    - name: revision
      expression: {{ include "drover.routes.revision" . | quote | squote }}
    - name: routes
      expression: |-
        {{- include "drover.routes" . | nindent 8 }}
  generate:
    - expression: generator.Apply({{ .Release.Namespace | quote }}, variables.routes)
