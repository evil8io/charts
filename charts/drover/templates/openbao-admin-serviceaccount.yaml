{{- if .Values.projectSync.serviceAccounts.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "drover.openbao.fullname" . }}-admin
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "drover.componentLabels" (dict "root" . "component" "openbao") | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
