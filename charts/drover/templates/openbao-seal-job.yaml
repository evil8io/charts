{{- if .Values.projectSync.serviceAccounts.enabled }}
{{- $component := dict "root" . "component" "openbao-seal" }}
{{- $name := include "drover.openbaoSeal.fullname" . }}
{{- $secret := include "drover.openbao.sealSecretName" . }}
{{- $claims := list }}
{{- range $i := until (int .Values.openbao.server.ha.replicas) }}
{{- $claims = append $claims (printf "data-%s-%d" (include "drover.openbao.fullname" $) $i) }}
{{- end }}
{{- $annotations := dict "hook" "pre-install,pre-upgrade" "weight" 0 }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "drover.componentLabels" $component | nindent 4 }}
  annotations:
    {{- include "drover.serviceUser.hookAnnotations" $annotations | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "drover.componentLabels" $component | nindent 4 }}
  annotations:
    {{- include "drover.serviceUser.hookAnnotations" $annotations | nindent 4 }}
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
      - {{ $secret }}
    verbs:
      - get
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - create
  - apiGroups:
      - ""
    resources:
      - persistentvolumeclaims
    resourceNames:
      {{- toYaml $claims | nindent 6 }}
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "drover.componentLabels" $component | nindent 4 }}
  annotations:
    {{- include "drover.serviceUser.hookAnnotations" $annotations | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
{{- if .Values.ciliumNetworkPolicy.enabled }}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "drover.componentLabels" $component | nindent 4 }}
  annotations:
    {{- include "drover.serviceUser.hookAnnotations" $annotations | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      {{- include "drover.componentSelectorLabels" $component | nindent 6 }}
  egress:
    - toEntities:
        - kube-apiserver
{{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "drover.componentLabels" $component | nindent 4 }}
  annotations:
    {{- include "drover.serviceUser.hookAnnotations" (dict "hook" "pre-install,pre-upgrade" "weight" 1) | nindent 4 }}
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        {{- include "drover.componentLabels" $component | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ $name }}
      automountServiceAccountToken: true
      securityContext:
        {{- include "drover.podSecurityContext" . | nindent 8 }}
        runAsUser: 1001
        runAsGroup: 1001
      containers:
        - name: openbao-seal
          image: {{ .Values.serviceUser.hook.image | quote }}
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -eu
              kubectl get secret {{ $secret }} >/dev/null 2>&1 && exit 0
              for claim in {{ join " " $claims }}; do
                found=$(kubectl get persistentvolumeclaim "$claim" --ignore-not-found -o name)
                if [ -n "$found" ]; then
                  echo "the Secret {{ $secret }} does not exist, but the PersistentVolumeClaim $claim exists, and a new seal key cannot unseal its data" >&2
                  echo "restore the Secret {{ $secret }}, or delete the data-* PersistentVolumeClaims of OpenBao" >&2
                  exit 1
                fi
              done
              key=$(head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n')
              kubectl create -f - <<EOF
              apiVersion: v1
              kind: Secret
              metadata:
                name: {{ $secret }}
                labels:
                  {{- include "drover.componentSelectorLabels" $component | nindent 18 }}
              type: Opaque
              stringData:
                key: $key
              EOF
          env:
            - name: HOME
              value: /tmp
          securityContext:
            {{- include "drover.securityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.serviceUser.hook.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
