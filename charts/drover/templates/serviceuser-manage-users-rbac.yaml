{{- if .Values.serviceUser.manageUsersSubjects }}
{{- $name := printf "%s-manage-users" (include "drover.fullname" .) }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}
  labels:
    {{- include "drover.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - management.cattle.io
    resources:
      - users
    verbs:
      - manage-users
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "drover.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $name }}
subjects:
  {{- toYaml .Values.serviceUser.manageUsersSubjects | nindent 2 }}
{{- end }}
