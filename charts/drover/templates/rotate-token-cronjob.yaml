{{- $component := dict "root" . "component" "rotate-token" }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "drover.rotateToken.fullname" . }}
  labels:
    {{- include "drover.componentLabels" $component | nindent 4 }}
spec:
  schedule: {{ .Values.tokenRotation.schedule | quote }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: {{ .Values.tokenRotation.startingDeadlineSeconds }}
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels:
        {{- include "drover.componentLabels" $component | nindent 8 }}
    spec:
      backoffLimit: 6
      template:
        {{- include "drover.rotateToken.podTemplate" . | nindent 8 }}
