{{- if .Values.projectSync.serviceAccounts.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "drover.projectSync.fullname" . }}-trust
  labels:
    {{- include "drover.componentLabels" (dict "root" . "component" "project-sync") | nindent 4 }}
data:
  trust.json: |
    {{- include "drover.trust.rules" . | fromJson | toPrettyJson | nindent 4 }}
{{- end }}
