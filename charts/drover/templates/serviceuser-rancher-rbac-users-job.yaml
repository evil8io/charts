{{- $component := dict "root" . "component" "rancher-rbac" }}
{{- $name := include "drover.serviceUser.rancherRbac.fullname" . }}
{{- $root := . }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}-users
  labels:
    {{- include "drover.componentLabels" $component | nindent 4 }}
  annotations:
    {{- include "drover.serviceUser.hookAnnotations" (dict "hook" "pre-upgrade" "weight" 1) | nindent 4 }}
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        {{- include "drover.componentLabels" $component | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ $name }}
      automountServiceAccountToken: true
      securityContext:
        {{- include "drover.podSecurityContext" . | nindent 8 }}
        runAsUser: 1001
        runAsGroup: 1001
      containers:
        - name: rancher-rbac-users
          image: {{ .Values.serviceUser.hook.image | quote }}
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -eu
              {{- range $user := include "drover.serviceUser.users" . | fromYamlArray }}
              user=$(kubectl get user.management.cattle.io {{ $user.name }} --ignore-not-found --output name)
              if [ -n "$user" ]; then
                kubectl patch user.management.cattle.io {{ $user.name }} --type merge --patch-file /dev/stdin <<'EOF'
              {{- include "drover.serviceUser.user" (dict "root" $root "name" $user.name "username" $user.username) | nindent 14 }}
              EOF
              fi
              {{- end }}
          env:
            - name: HOME
              value: /tmp
          securityContext:
            {{- include "drover.securityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.serviceUser.hook.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
