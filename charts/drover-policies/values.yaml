---
# The platform that the cluster runs on: generic, aws, or azure. It selects the cloud-specific policies. This policy set has none yet.
platform: generic

# The prefix of the keys of drover itself: the records of the project sync, the labels of the project ServiceAccounts and their bindings, the route revision label, and the trust status annotation. The keys that the project sync copies from a Rancher project are not under this prefix. The value must equal the constant managedPrefix in internal/projectsync/keys.go of drover. Through the managed-metadata policy, the API server denies a write to a key under this prefix. A ServiceAccount of the Kyverno namespace and a requester with permission to patch every namespace are exempt.
managedPrefix: managed.drover.evil8.io/

kyverno:
  # The namespace of the Kyverno controllers. Their ServiceAccounts may write generated objects.
  namespace: kyverno

rancher:
  # The namespace of the Rancher Deployment. The namespace-orphan policy skips the writes of its ServiceAccounts.
  namespace: cattle-system

externalDns:
  annotationPrefix: external-dns.alpha.kubernetes.io/

# The namespaced kinds that tenants get through the Kubernetes view, edit, and admin roles, as a map from API group to resource plurals. The verbs are fixed in the templates: get, list, and watch for view; create, update, patch, delete, and deletecollection for edit and admin. List each kind of edit or admin under view too, because the verb lists of edit and admin include no read verb. Helm renders no ClusterRole for an empty map.
tenantRoles:
  view: {}
  edit: {}
  admin: {}

# The kinds that every Rancher user can get, list, and watch. The key cluster is a map from API group to resource plurals, and the users read these kinds cluster-wide. The key namespaces is a map from namespace name to such a map, and the users read these kinds in that namespace only. Helm renders the ClusterRole drover:public-read and binds it to the group system:cattle:authenticated. The ClusterRole also contains get on each namespace of the key namespaces. For each namespace with a map that is not empty, Helm renders a Role and a RoleBinding. The Role also contains the verb get on the namespace object itself. For a namespace with an empty map, Helm does not render a Role. The users can get that namespace object through the ClusterRole only. When both maps are empty, Helm does not render any object.
publicRead:
  cluster: {}
  namespaces: {}

# When true, Helm installs the ClusterRole drover:users and binds it to the group system:cattle:authenticated, so that every Rancher user can read principals and roletemplates. The Rancher UI reads both when a project owner adds members to a project. Rancher checks this access in the Rancher management cluster only, so enable it there.
rancherUsers:
  enabled: false

policies:
  namespace-project:
    enabled: true
    # Annotation key on a namespace that has the display name of its project. The deny message shows the name next to the project id. Empty turns the hint off.
    nameAnnotation: project.display_name
  namespace-quotas:
    enabled: true
    # Part of the policy name and of the generated names. Bump it when a generated field that is immutable changes.
    revision: 1
    hard:
      count/pods: "3k"
      count/jobs.batch: "1k"
      count/secrets: "1k"
      count/services: "500"
      count/configmaps: "1k"
      count/replicasets.apps: "1k"
      count/daemonsets.apps: "0"
      count/replicationcontrollers: "0"
      count/services.nodeports: "0"
      count/services.loadbalancers: "0"
  namespace-metadata:
    enabled: true
  namespace-platform-metadata:
    enabled: true
    # The names of the platform namespaces that have a project. A namespace without the project annotation is a platform namespace too. Put the names that Rancher puts in its System project here.
    namespaces: []
    # The labels and the annotations that Kyverno sets on every platform namespace. With both empty, Helm renders no policy.
    labels: {}
    annotations: {}
  namespace-platform-name:
    enabled: true
    # Name prefixes that a Rancher user cannot use for a namespace, for example kube- and cattle-. The exact names come from policies.namespace-platform-metadata.namespaces.
    deniedPrefixes: []
  namespace-orphan:
    enabled: true
  route-hostname:
    enabled: true
  listenerset-hostname:
    enabled: true
  prometheus-monitors:
    enabled: true
  generated-integrity:
    enabled: true
  managed-metadata:
    enabled: true

# An entry without enabled follows the policies that read it.
globalContextEntries:
  namespaces: {}
  clusterrolebindings: {}
  httproutes: {}
  grpcroutes: {}
  tlsroutes: {}
  listenersets: {}
  services: {}
