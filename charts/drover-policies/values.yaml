---
# The prefix of the keys that drover writes for itself, for example the records of the project sync. The keys that the project sync copies from a Rancher project are not under it. It must equal the constant managedPrefix in internal/projectsync/keys.go of drover. We deny a write to a key under it, except by the Kyverno ServiceAccounts and by a requester who can patch every namespace, so that a tenant cannot change the keys of drover.
managedPrefix: managed.drover.evil8.io/

kyverno:
  # The namespace of the Kyverno controllers. Their ServiceAccounts may write generated objects.
  namespace: kyverno

rancher:
  # The namespace of the Rancher Deployment. The namespace-orphan policy skips the writes of its ServiceAccounts.
  namespace: cattle-system
  # The RBAC subjects of the cluster administrators. We give each subject the Rancher verbs manage-namespaces and updatepsa on every project. Without the verbs, Rancher denies an administrator who puts a namespace in a project or sets a Pod Security label on a namespace. Set it on AKS with Azure RBAC, because the Azure role of an administrator does not include the verbs.
  manageNamespacesSubjects: []
  # - kind: Group
  #   name: cluster-admins
  #   apiGroup: rbac.authorization.k8s.io

externalDns:
  annotationPrefix: external-dns.kubernetes.io/

# The namespaced kinds that tenants get through the Kubernetes view, edit, and admin roles, as a map from API group to resource plurals. The verbs are fixed in the templates: get, list, and watch for view; create, update, patch, delete, and deletecollection for edit and admin. List each kind of edit or admin under view too, because the verb lists of edit and admin do not include a read verb.
tenantRoles:
  view: {}
  edit: {}
  admin: {}

# The kinds that every Rancher user can get, list, and watch. Under cluster, as a map from API group to resource plurals, the users read the kinds cluster-wide. Under namespaces, as a map from namespace name to such a map, the users read the kinds in that namespace only, and they can get the namespace object. We do not create a Role in a namespace with an empty map, so that the install does not fail for a namespace that another component creates later.
publicRead:
  cluster: {}
  namespaces: {}

# When true, we let every Rancher user read the principals and the roletemplates of Rancher. The Rancher UI reads both when a project owner adds members to a project. Rancher checks this access in the Rancher management cluster only, so enable it there.
rancherUsers:
  enabled: false

policies:
  namespace-project:
    enabled: true
    # The key of the namespace annotation with the project display name. We add the name to each project id in the deny message, unless the key is empty.
    nameAnnotation: project.display_name
  namespace-quotas:
    enabled: true
    # Part of the policy name and of the generated names. Bump it when a generated field that is immutable changes.
    revision: 1
    hard:
      count/pods: "3k"
      count/jobs.batch: "1k"
      count/secrets: "1k"
      count/services: "500"
      count/configmaps: "1k"
      count/replicasets.apps: "1k"
      count/daemonsets.apps: "0"
      count/replicationcontrollers: "0"
      count/services.nodeports: "0"
      count/services.loadbalancers: "0"
  namespace-metadata:
    enabled: true
  namespace-platform-metadata:
    enabled: true
    # The names of the platform namespaces that have a project. A namespace without the project annotation is a platform namespace too. Put the names that Rancher puts in its System project here.
    namespaces: []
    # The labels and the annotations that Kyverno sets on every platform namespace. With both empty, Helm renders no policy.
    labels: {}
    annotations: {}
  namespace-platform-name:
    enabled: true
    # Name prefixes that a Rancher user cannot use for a namespace, for example kube- and cattle-. The exact names come from policies.namespace-platform-metadata.namespaces.
    deniedPrefixes: []
  namespace-orphan:
    enabled: true
  route-hostname:
    enabled: true
  listenerset-hostname:
    enabled: true
  prometheus-monitors:
    enabled: true
  generated-integrity:
    enabled: true
  managed-metadata:
    enabled: true
  managed-rolebindings:
    enabled: true

# An entry without enabled follows the policies that read it.
globalContextEntries:
  namespaces: {}
  clusterrolebindings: {}
  httproutes: {}
  grpcroutes: {}
  tlsroutes: {}
  listenersets: {}
  services: {}
