{{- if (index .Values.policies "prometheus-monitors").enabled }}
---
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: drover.prometheus-monitors
  labels:
    {{- include "drover-policies.labels" . | nindent 4 }}
  annotations:
    policies.kyverno.io/title: Scope Prometheus Monitor Namespace Selector
    policies.kyverno.io/category: Multi-Tenancy
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: PodMonitor, ServiceMonitor
    policies.kyverno.io/description: >-
      Sets namespaceSelector.matchNames to the own namespace on a PodMonitor or a
      ServiceMonitor, on CREATE and UPDATE, when the annotation
      field.cattle.io/projectId of the namespace names a Rancher project other
      than System and Default, or does not name a project of this cluster.
spec:
  evaluation:
    background:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups:
          - monitoring.coreos.com
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - podmonitors
          - servicemonitors
  variables:
    - name: nsAll
      expression: 'globalContext.Get("drover-namespaces", "") == null ? [] : globalContext.Get("drover-namespaces", "")'
    {{- include "drover-policies.projectVariables" (dict "ns" "namespaceObject") | nindent 4 }}
    {{- include "drover-policies.excludedProjectVariables" . | nindent 4 }}
    - name: restricted
      expression: >-
        variables.excludedProjectsKnown && variables.hasProject &&
        !(variables.projectId in variables.excludedProjectIds)
  mutations:
    - patchType: JSONPatch
      jsonPatch:
        expression: |-
          variables.restricted ? [
            JSONPatch{
              op: "add",
              path: "/spec/namespaceSelector",
              value: {"matchNames": [object.metadata.namespace]}
            }
          ] : []
{{- end }}
