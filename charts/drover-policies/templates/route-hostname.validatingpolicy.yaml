{{- if (index .Values.policies "route-hostname").enabled }}
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: drover.route-hostname
  labels:
    {{- include "drover-policies.labels" . | nindent 4 }}
  annotations:
    policies.kyverno.io/title: Prevent Cross-Project Route Hostname Conflicts
    policies.kyverno.io/category: Multi-Tenancy
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: HTTPRoute,GRPCRoute,TLSRoute,Service
    policies.kyverno.io/description: >-
      Gateway-parented routes (north/south) share the platform wildcard, so
      hostnames must be isolated per Rancher project. This policy blocks routes
      whose hostname is already used by a route in a different project, routes
      whose hostname equals the external-dns hostname annotation of a Service
      outside the project, routes without hostnames (they match every hostname
      of their listener) and wildcard hostnames (they capture all unclaimed
      names). Service-parented (GAMMA) routes are exempt.
spec:
  evaluation:
    background:
      enabled: false
  validationActions:
    - Deny
  matchConstraints:
    resourceRules:
      - apiGroups:
          - "gateway.networking.k8s.io"
        apiVersions:
          - "v1"
        operations:
          - CREATE
          - UPDATE
        resources:
          - httproutes
          - grpcroutes
          - tlsroutes
  variables:
    - name: nsAll
      expression: 'globalContext.Get("drover-namespaces", "") == null ? [] : globalContext.Get("drover-namespaces", "")'
    - name: httproutesAll
      expression: 'globalContext.Get("drover-httproutes", "") == null ? [] : globalContext.Get("drover-httproutes", "")'
    - name: grpcroutesAll
      expression: 'globalContext.Get("drover-grpcroutes", "") == null ? [] : globalContext.Get("drover-grpcroutes", "")'
    - name: tlsroutesAll
      expression: 'globalContext.Get("drover-tlsroutes", "") == null ? [] : globalContext.Get("drover-tlsroutes", "")'
    - name: servicesAll
      expression: 'globalContext.Get("drover-services", "") == null ? [] : globalContext.Get("drover-services", "")'
    - name: projectId
      expression: >-
        (has(namespaceObject.metadata.labels) &&
        "field.cattle.io/projectId" in namespaceObject.metadata.labels) ?
        namespaceObject.metadata.labels["field.cattle.io/projectId"] : ""
    - name: hasProjectId
      expression: >-
        variables.projectId != ""
    - name: isNorthSouth
      expression: >-
        object.spec.?parentRefs.orValue([]).exists(pr,
          pr.?group.orValue('gateway.networking.k8s.io') == 'gateway.networking.k8s.io' &&
          pr.?kind.orValue('Gateway') == 'Gateway'
        )
    - name: governed
      expression: >-
        variables.hasProjectId && variables.isNorthSouth
    - name: hostnames
      expression: "object.spec.?hostnames.orValue([])"
    - name: projectNamespaces
      expression: >-
        variables.hasProjectId ?
        variables.nsAll.filter(ns,
          has(ns.metadata.labels) &&
          "field.cattle.io/projectId" in ns.metadata.labels &&
          ns.metadata.labels["field.cattle.io/projectId"] == variables.projectId
        ).map(ns, ns.metadata.name) : []
    - name: conflictingRoutes
      expression: >-
        (variables.httproutesAll + variables.grpcroutesAll + variables.tlsroutesAll).filter(r,
          !(r.metadata.name == object.metadata.name && r.metadata.namespace == object.metadata.namespace) &&
          r.spec.?parentRefs.orValue([]).exists(pr,
            pr.?group.orValue('gateway.networking.k8s.io') == 'gateway.networking.k8s.io' &&
            pr.?kind.orValue('Gateway') == 'Gateway'
          ) &&
          r.spec.?hostnames.orValue([]).exists(h, h in variables.hostnames) &&
          !(r.metadata.namespace in variables.projectNamespaces)
        ).map(r, r.metadata.namespace + '/' + r.metadata.name)
    - name: conflictingServices
      expression: >-
        variables.servicesAll.filter(s,
          !(s.metadata.namespace in variables.projectNamespaces) &&
          has(s.metadata.annotations) &&
          '{{ .Values.externalDns.annotationPrefix }}hostname' in s.metadata.annotations &&
          s.metadata.annotations['{{ .Values.externalDns.annotationPrefix }}hostname'].split(',').exists(h, h.trim() in variables.hostnames)
        ).map(s, s.metadata.namespace + '/' + s.metadata.name)
  validations:
    - expression: >-
        !variables.governed || variables.hostnames.size() > 0
      message: >-
        Gateway-parented routes must specify at least one hostname; a route without hostnames matches every hostname of its listener.
    - expression: >-
        !variables.governed || variables.hostnames.all(h, !h.startsWith('*.'))
      message: >-
        Wildcard hostnames are not allowed on Gateway-parented routes.
    - expression: >-
        !variables.governed || variables.conflictingRoutes.size() == 0
      messageExpression: >-
        'One of the configured route hostnames is already configured in another project. Conflicting: ' + variables.conflictingRoutes.join(', ')
    - expression: >-
        !variables.governed || variables.conflictingServices.size() == 0
      messageExpression: >-
        'One of the configured route hostnames is already set as the external-dns hostname annotation of a platform Service. Conflicting: ' + variables.conflictingServices.join(', ')
{{- end }}
