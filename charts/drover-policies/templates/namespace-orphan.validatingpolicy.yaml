{{- if (index .Values.policies "namespace-orphan").enabled }}
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: drover.namespace-orphan
  labels:
    {{- include "drover-policies.labels" . | nindent 4 }}
  annotations:
    policies.kyverno.io/title: Prevent Namespace Project Removal
    policies.kyverno.io/category: Multi-Tenancy
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Namespace
    policies.kyverno.io/description: >-
      Denies an update of a Namespace that removes or empties the annotation
      field.cattle.io/projectId, when the requester may not manage the
      namespaces of every Rancher project. Skips the ServiceAccounts of the
      Rancher namespace.
spec:
  failurePolicy: Fail
  evaluation:
    background:
      enabled: false
  validationActions:
    - Deny
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - UPDATE
        resources:
          - namespaces
  matchConditions:
    - name: not-rancher-serviceaccount
      expression: >-
        !request.userInfo.username.startsWith("system:serviceaccount:{{ .Values.rancher.namespace }}:")
    - name: project-annotation-removed
      expression: >-
        has(oldObject.metadata.annotations) &&
        ("field.cattle.io/projectId" in oldObject.metadata.annotations) &&
        oldObject.metadata.annotations["field.cattle.io/projectId"] != "" &&
        (!has(object.metadata.annotations) ||
        !("field.cattle.io/projectId" in object.metadata.annotations) ||
        object.metadata.annotations["field.cattle.io/projectId"] == "")
  variables:
    - name: unrestricted
      expression: |-
        resource.Post("authorization.k8s.io/v1", "subjectaccessreviews", "", {
          "apiVersion": dyn("authorization.k8s.io/v1"),
          "kind": dyn("SubjectAccessReview"),
          "spec": dyn({
            "user": dyn(request.userInfo.username),
            "groups": dyn(request.userInfo.groups),
            "extra": has(request.userInfo.extra) ? dyn(request.userInfo.extra) : dyn({}),
            "resourceAttributes": dyn({
              "group": "management.cattle.io",
              "resource": "projects",
              "verb": "manage-namespaces"
            })
          })
        }).status.allowed == true
  validations:
    - expression: variables.unrestricted
      message: >-
        A namespace cannot leave its project. Move the namespace to another
        project, or delete it.
{{- end }}
