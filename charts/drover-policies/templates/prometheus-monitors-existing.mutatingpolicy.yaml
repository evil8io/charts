{{- if (index .Values.policies "prometheus-monitors").enabled }}
---
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: drover.prometheus-monitors-existing
  labels:
    {{- include "drover-policies.labels" . | nindent 4 }}
  annotations:
    policies.kyverno.io/title: Scope Existing Prometheus Monitors on Project Change
    policies.kyverno.io/category: Multi-Tenancy
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: PodMonitor, ServiceMonitor
    policies.kyverno.io/description: >-
      Sets namespaceSelector.matchNames to the own namespace on every existing
      PodMonitor and ServiceMonitor in a namespace whose annotation
      field.cattle.io/projectId changes to a project other than System and
      Default, or to a value that does not name a project of this cluster. A
      change to the System or the Default project changes nothing.
spec:
  evaluation:
    background:
      enabled: false
    mutateExisting:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - UPDATE
        resources:
          - namespaces
  matchConditions:
    - name: project-annotation-changed
      expression: >-
        {{ include "drover-policies.projectAnnotation" "object" }}
        !=
        {{ include "drover-policies.projectAnnotation" "oldObject" }}
  variables:
    - name: nsName
      expression: request.object.metadata.name
    - name: nsAll
      expression: 'globalContext.Get("drover-namespaces", "") == null ? [] : globalContext.Get("drover-namespaces", "")'
    {{- include "drover-policies.projectVariables" (dict "ns" "request.object") | nindent 4 }}
    {{- include "drover-policies.excludedProjectVariables" . | nindent 4 }}
    - name: restricted
      expression: >-
        variables.excludedProjectsKnown && variables.hasProject &&
        !(variables.projectId in variables.excludedProjectIds)
  targetMatchConstraints:
    resourceRules:
      - apiGroups:
          - monitoring.coreos.com
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - podmonitors
          - servicemonitors
  targetMatchConditions:
    - name: same-namespace
      expression: object.metadata.namespace == variables.nsName
    - name: not-terminating
      expression: '!has(object.metadata.deletionTimestamp)'
  mutations:
    - patchType: JSONPatch
      jsonPatch:
        expression: |-
          !variables.restricted ? [] :
          (has(object.spec.namespaceSelector) && object.spec.namespaceSelector == {"matchNames": [object.metadata.namespace]}) ? [] :
          [
            JSONPatch{
              op: "add",
              path: "/spec/namespaceSelector",
              value: {"matchNames": [object.metadata.namespace]}
            }
          ]
{{- end }}
