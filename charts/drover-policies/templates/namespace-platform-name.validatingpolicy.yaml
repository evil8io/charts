{{- $policy := index .Values.policies "namespace-platform-name" }}
{{- $platform := index .Values.policies "namespace-platform-metadata" }}
{{- if $policy.enabled }}
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: drover.namespace-platform-name
  labels:
    {{- include "drover-policies.labels" . | nindent 4 }}
  annotations:
    policies.kyverno.io/title: Platform Namespace Creation
    policies.kyverno.io/category: Multi-Tenancy
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Namespace
    policies.kyverno.io/description: >-
      Denies a Namespace that a Rancher user creates with a name in the list
      of the platform namespaces or with a platform prefix, when the
      requester may not patch every namespace of the cluster.
spec:
  evaluation:
    background:
      enabled: false
  validationActions:
    - Deny
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
        resources:
          - namespaces
  matchConditions:
    - name: rancher-user
      expression: >-
        has(request.userInfo.groups) &&
        "system:cattle:authenticated" in request.userInfo.groups
  variables:
    - name: allowed
      expression: |-
        resource.Post("authorization.k8s.io/v1", "subjectaccessreviews", "", {
          "apiVersion": dyn("authorization.k8s.io/v1"),
          "kind": dyn("SubjectAccessReview"),
          "spec": dyn({
            "user": dyn(request.userInfo.username),
            "groups": dyn(request.userInfo.groups),
            "extra": has(request.userInfo.extra) ? dyn(request.userInfo.extra) : dyn({}),
            "resourceAttributes": dyn({
              "group": "",
              "resource": "namespaces",
              "verb": "patch"
            })
          })
        }).status.allowed == true
  validations:
    - expression: '!(object.metadata.name in {{ toJson $platform.namespaces }}) || variables.allowed'
      message: The namespace name is reserved for the platform.
{{- if $policy.deniedPrefixes }}
    - expression: '!{{ toJson $policy.deniedPrefixes }}.exists(p, object.metadata.name.startsWith(p)) || variables.allowed'
      message: The namespace name prefix is reserved for the platform.
{{- end }}
{{- end }}
