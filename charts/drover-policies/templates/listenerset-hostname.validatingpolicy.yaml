{{- if (index .Values.policies "listenerset-hostname").enabled }}
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: drover.listenerset-hostname
  labels:
    {{- include "drover-policies.labels" . | nindent 4 }}
  annotations:
    policies.kyverno.io/title: Prevent Cross-Project ListenerSet Hostname Conflicts
    policies.kyverno.io/category: Multi-Tenancy
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: ListenerSet
    policies.kyverno.io/description: >-
      Denies a ListenerSet in a namespace with the annotation
      field.cattle.io/projectId, on CREATE and UPDATE, when the annotation does
      not name a project of this cluster, when a listener has no hostname, or
      when a listener hostname is in use by a ListenerSet outside the project.
      A listener without a hostname is a catch-all on its port. The hostname
      match is exact, so a wildcard and an exact name do not conflict.
spec:
  evaluation:
    background:
      enabled: false
  validationActions:
    - Deny
  matchConstraints:
    resourceRules:
      - apiGroups:
          - "gateway.networking.k8s.io"
        apiVersions:
          - "v1"
        operations:
          - CREATE
          - UPDATE
        resources:
          - listenersets
  variables:
    - name: nsAll
      expression: 'globalContext.Get("drover-namespaces", "") == null ? [] : globalContext.Get("drover-namespaces", "")'
    - name: listenersetsAll
      expression: 'globalContext.Get("drover-listenersets", "") == null ? [] : globalContext.Get("drover-listenersets", "")'
    {{- include "drover-policies.projectVariables" (dict "ns" "namespaceObject") | nindent 4 }}
    - name: hostnames
      expression: "object.spec.listeners.map(l, l.?hostname.orValue(''))"
    - name: projectNamespaces
      expression: >-
        variables.projectId != "" ?
        variables.nsAll.filter(ns,
          {{ include "drover-policies.projectAnnotation" "ns" }} == variables.clusterId + ":" + variables.projectId
        ).map(ns, ns.metadata.name) : []
    - name: conflictingListenerSets
      expression: >-
        variables.listenersetsAll.filter(ls,
          !(ls.metadata.name == object.metadata.name && ls.metadata.namespace == object.metadata.namespace) &&
          ls.spec.?listeners.orValue([]).exists(l, l.?hostname.orValue('') in variables.hostnames) &&
          !(ls.metadata.namespace in variables.projectNamespaces)
        ).map(ls, ls.metadata.namespace + '/' + ls.metadata.name)
  validations:
    - expression: >-
        !variables.hasProject || variables.projectId != ""
      message: >-
        This namespace is not in a project of this cluster. Only an administrator can correct its annotation field.cattle.io/projectId.
    - expression: >-
        !variables.hasProject || object.spec.listeners.all(l, l.?hostname.orValue('') != '')
      message: >-
        This ListenerSet has a listener without a hostname. Set a hostname on each listener.
    - expression: >-
        !variables.hasProject || variables.conflictingListenerSets.size() == 0
      messageExpression: >-
        'This ListenerSet uses a hostname that is in use by another project: ' + variables.conflictingListenerSets.join(', ') + '. Use another hostname.'
{{- end }}
