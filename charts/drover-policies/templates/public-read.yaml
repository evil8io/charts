{{- $cluster := .Values.publicRead.cluster }}
{{- $namespaces := .Values.publicRead.namespaces }}
{{- if or $cluster $namespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: drover:public-read
  labels:
    {{- include "drover-policies.labels" . | nindent 4 }}
rules:
  {{- range $group := (keys $cluster | sortAlpha) }}
  - apiGroups:
      - {{ $group | quote }}
    resources:
      {{- range (index $cluster $group | uniq | sortAlpha) }}
      - {{ . }}
      {{- end }}
    verbs:
      - get
      - list
      - watch
  {{- end }}
  {{- if $namespaces }}
  - apiGroups:
      - ""
    resources:
      - namespaces
    resourceNames:
      {{- range (keys $namespaces | sortAlpha) }}
      - {{ . }}
      {{- end }}
    verbs:
      - get
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: drover:public-read
  labels:
    {{- include "drover-policies.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: drover:public-read
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: system:cattle:authenticated
{{- range $namespace := (keys $namespaces | sortAlpha) }}
{{- $kinds := index $namespaces $namespace }}
{{- if $kinds }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: drover:public-read
  namespace: {{ $namespace }}
  labels:
    {{- include "drover-policies.labels" $ | nindent 4 }}
rules:
  - apiGroups:
      - ""
    resources:
      - namespaces
    verbs:
      - get
  {{- range $group := (keys $kinds | sortAlpha) }}
  - apiGroups:
      - {{ $group | quote }}
    resources:
      {{- range (index $kinds $group | uniq | sortAlpha) }}
      - {{ . }}
      {{- end }}
    verbs:
      - get
      - list
      - watch
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: drover:public-read
  namespace: {{ $namespace }}
  labels:
    {{- include "drover-policies.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: drover:public-read
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: system:cattle:authenticated
{{- end }}
{{- end }}
{{- end }}
