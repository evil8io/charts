{{- $policy := index .Values.policies "namespace-quotas" }}
{{- if $policy.enabled }}
---
apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: drover.namespace-quotas.{{ $policy.revision }}
  labels:
    {{- include "drover-policies.labels" . | nindent 4 }}
  annotations:
    policies.kyverno.io/title: Generate Namespace Quotas
    policies.kyverno.io/category: Multi-Tenancy
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: ResourceQuota,LimitRange
    policies.kyverno.io/description: >-
      Generates a ResourceQuota and a LimitRange in every namespace with the
      annotation field.cattle.io/projectId, except a namespace in the System or
      the Default project.
spec:
  evaluation:
    synchronize:
      enabled: true
    generateExisting:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - namespaces
  matchConditions:
    - name: has-project-annotation
      expression: >-
        {{ include "drover-policies.projectAnnotation" "object" }} != ""
  variables:
    - name: nsAll
      expression: 'globalContext.Get("drover-namespaces", "") == null ? [] : globalContext.Get("drover-namespaces", "")'
    {{- include "drover-policies.projectVariables" (dict "ns" "object") | nindent 4 }}
    {{- include "drover-policies.excludedProjectVariables" . | nindent 4 }}
    - name: governed
      expression: >-
        variables.excludedProjectsKnown && variables.hasProject &&
        !(variables.projectId in variables.excludedProjectIds)
    - name: terminating
      expression: >-
        variables.nsAll.exists(ns,
          ns.metadata.name == object.metadata.name && has(ns.metadata.deletionTimestamp))
    - name: resources
      expression: |-
        (!variables.governed || variables.terminating) ? [] : [
          {
            "apiVersion": dyn("v1"),
            "kind": dyn("ResourceQuota"),
            "metadata": dyn({
              "name": dyn("counts.{{ $policy.revision }}"),
              "namespace": dyn(object.metadata.name),
              "ownerReferences": dyn([
                {
                  "apiVersion": object.apiVersion,
                  "kind": object.kind,
                  "name": object.metadata.name,
                  "uid": object.metadata.uid
                }
              ])
            }),
            "spec": dyn({
              "hard": {{ toJson $policy.hard }}
            })
          },
          {
            "apiVersion": dyn("v1"),
            "kind": dyn("LimitRange"),
            "metadata": dyn({
              "name": dyn("default.{{ $policy.revision }}"),
              "namespace": dyn(object.metadata.name),
              "ownerReferences": dyn([
                {
                  "apiVersion": object.apiVersion,
                  "kind": object.kind,
                  "name": object.metadata.name,
                  "uid": object.metadata.uid
                }
              ])
            }),
            "spec": dyn({
              "limits": [
                {
                  "default": dyn({"ephemeral-storage": "2Gi"}),
                  "defaultRequest": dyn({"ephemeral-storage": "200Mi"}),
                  "type": dyn("Container")
                }
              ]
            })
          }
        ]
  generate:
    - expression: generator.Apply(object.metadata.name, variables.resources)
{{- end }}
