{{- if (index .Values.policies "generated-integrity").enabled }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: drover.generated-integrity
  labels:
    {{- include "drover-policies.labels" . | nindent 4 }}
spec:
  policyName: drover.generated-integrity
  validationActions:
    - Deny
{{- end }}
