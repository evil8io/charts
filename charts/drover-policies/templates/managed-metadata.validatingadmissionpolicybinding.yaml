{{- if (index .Values.policies "managed-metadata").enabled }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: drover.managed-metadata
  labels:
    {{- include "drover-policies.labels" . | nindent 4 }}
spec:
  policyName: drover.managed-metadata
  validationActions:
    - Deny
{{- end }}
