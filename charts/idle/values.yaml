---
nameOverride: ""
fullnameOverride: ""

# One PriorityClass for every deployment in the release. The negative value
# makes the idle pods preemptible by every other workload.
priorityClass:
  create: true
  name: idle
  value: -1000000
  description: "Evil8 idle pods used to pre-provision node capacity; always preemptible."

# Applied to every entry in .deployments unless overridden there.
defaults:
  image: spurin/idle:latest@sha256:7c9b9832a35b902f378a4c37c4578fb07e137d5fb33075d9bc18988df49fa2a7
  imagePullPolicy: IfNotPresent
  imagePullSecrets: []
  replicas: 1
  podAnnotations: {}
  podLabels: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    fsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    privileged: false
    readOnlyRootFilesystem: true
  resources:
    requests:
      cpu: 10m
      memory: 8Mi
    limits:
      cpu: 50m
      memory: 32Mi
  nodeSelector: {}
  tolerations: []
  # Passed through as is. The podAntiAffinity toggle below merges into it.
  affinity: {}
  topologySpreadConstraints: []

  # Adds an affinity.podAntiAffinity term on idle.evil8.io/deployment=<name>.
  # The pods of one deployment then spread across nodes, independent of the
  # other deployments in the release.
  podAntiAffinity:
    enabled: false
    mode: soft                     # "soft" | "hard"
    topologyKey: kubernetes.io/hostname
    weight: 100  # used only when mode=soft

  # An empty string selects .Values.priorityClass.name when priorityClass.create is true.
  priorityClassName: ""
  terminationGracePeriodSeconds: 0
  restartPolicy: Always
  serviceAccount:
    create: false
    annotations: {}
    # name: ""  # when create=false, "default" is used unless overridden here

  # The default PDB permits full disruption. It marks the workload as PDB-aware
  # for tooling. Set a budget per deployment when needed. A `minAvailable` needs
  # `maxUnavailable: null`, because the chart rejects both fields set.
  pdb:
    enabled: true
    minAvailable:
    maxUnavailable: "100%"

  # KEDA ScaledObject. KEDA creates its own HPA, so the chart omits spec.replicas
  # on the Deployment when scaledObject.enabled is true.
  scaledObject:
    enabled: false
    minReplicaCount: 1
    maxReplicaCount: 10
    pollingInterval: 30
    cooldownPeriod: 300
    idleReplicaCount:
    fallback: {}
    advanced: {}
    triggers: []  # required when enabled

# Map of deployment name to a partial override of `defaults`.
deployments: {}
# Example:
# deployments:
#   warm-general:
#     replicas: 20
#     podAntiAffinity:
#       enabled: true
#       mode: soft
#   warm-arm64:
#     replicas: 5
#     nodeSelector:
#       kubernetes.io/arch: arm64
#   warm-cron:
#     scaledObject:
#       enabled: true
#       minReplicaCount: 1
#       maxReplicaCount: 50
#       triggers:
#         - type: cron
#           metadata:
#             timezone: UTC
#             start: "0 8 * * MON-FRI"
#             end: "0 18 * * MON-FRI"
#             desiredReplicas: "50"
