{{- $cluster := and .Values.collectors.cluster.enabled .Values.collectors.cluster.targetAllocator.enabled }}
{{- $node := and .Values.collectors.node.enabled .Values.collectors.node.targetAllocator.enabled }}
{{- if or $cluster $node }}
{{- $name := printf "%s-targetallocator" (include "opentelemetry-collectors.fullname" .) }}
# The target allocator watches the secrets that a monitor references, in the release namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  labels:
    {{- include "opentelemetry-collectors.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources:
      - secrets
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "opentelemetry-collectors.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  {{- if $cluster }}
  - kind: ServiceAccount
    name: {{ include "opentelemetry-collectors.collectorName" (dict "root" . "key" "cluster") }}-targetallocator
    namespace: {{ .Release.Namespace }}
  {{- end }}
  {{- if $node }}
  - kind: ServiceAccount
    name: {{ include "opentelemetry-collectors.collectorName" (dict "root" . "key" "node") }}-targetallocator
    namespace: {{ .Release.Namespace }}
  {{- end }}
{{- end }}
