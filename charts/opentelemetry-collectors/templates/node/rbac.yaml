{{- if .Values.collectors.node.enabled }}
{{- $name := include "opentelemetry-collectors.collectorName" (dict "root" . "key" "node") }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "opentelemetry-collectors.labels" . | nindent 4 }}
  {{- with .Values.aws.roleArn }}
  annotations:
    eks.amazonaws.com/role-arn: {{ . }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}-collector
  labels:
    {{- include "opentelemetry-collectors.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "opentelemetry-collectors.clusterRoleName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
  {{- if .Values.collectors.node.targetAllocator.enabled }}
  - kind: ServiceAccount
    name: {{ $name }}-targetallocator
    namespace: {{ .Release.Namespace }}
  {{- end }}
{{- end }}
