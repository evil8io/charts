---
apiVersion: v2
name: opentelemetry-collectors
description: OpenTelemetry collectors for the logs, metrics, and events of a Kubernetes cluster, managed by the opentelemetry-operator
type: application
version: 0.1.0
appVersion: "0.161.0"
dependencies:
  - name: kube-state-metrics
    version: 8.5.0
    repository: https://prometheus-community.github.io/helm-charts
    condition: kubeStateMetrics.enabled
  - name: prometheus-node-exporter
    version: 4.57.0
    repository: https://prometheus-community.github.io/helm-charts
    condition: nodeExporter.enabled
